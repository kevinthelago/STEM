[package]
name = "stem"
version = "0.1.0"
edition = "2021"

[package.metadata.bundle]
identifier = "com.stem.app"

[lib]
name = "stem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
stem-data = { path = "../crates/data" }

# Unix: kill the whole PTY process group (shell + claude + grandchildren) on close.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: Job Object so the whole PTY process tree dies when the job handle closes.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
